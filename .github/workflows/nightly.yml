name: Nightly

# All e2e tests, with the long MCP stream test (spec section 15.3).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e-all:
    name: E2E with the long MCP stream test (k3d)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install k3d (version of scripts/versions.sh, SHA-256 checked)
        run: |
          bash packages/e2e/scripts/install-k3d.sh "$RUNNER_TEMP/k3d"
          echo "$RUNNER_TEMP/k3d" >> "$GITHUB_PATH"
      - name: Resolve the dev host names to 127.0.0.1
        run: echo '127.0.0.1 hydra.localhost live.hydra.localhost' | sudo tee -a /etc/hosts
      - name: Create the dev cluster (images of this commit, dev overlay, test site)
        run: bash scripts/dev-cluster.sh
      # The Chromium of @playwright/test 1.63.0 (chromium-1243). The Chromium of @playwright/mcp
      # in the job test (chromium-1247) is another revision; the two are independent.
      - name: Install Chromium for Playwright
        run: pnpm --filter @hydra/e2e exec playwright install --with-deps chromium
      - name: All e2e tests
        run: pnpm --filter @hydra/e2e run test:all
        env:
          HYDRA_E2E_OUTPUT_DIR: ${{ runner.temp }}/hydra-e2e
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-nightly
          path: ${{ runner.temp }}/hydra-e2e/playwright-report
          retention-days: 14
      - name: Cluster diagnostics
        if: failure() || cancelled()
        run: bash packages/e2e/scripts/diagnostics.sh
